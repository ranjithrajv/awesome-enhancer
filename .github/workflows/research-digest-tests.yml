name: Research Digest Tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/research-digest/**'
      - '.github/workflows/research-digest*.yml'
      - '.github/workflows/digest-apply.yml'
      - '.github/workflows/research-digest-tests.yml'
  pull_request:
    paths:
      - 'tools/research-digest/**'
      - '.github/workflows/research-digest*.yml'
      - '.github/workflows/digest-apply.yml'
      - '.github/workflows/research-digest-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-digest-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/research-digest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest
