name: Research Digest

# Reusable workflow: call it from a list repository with
#
#   jobs:
#     digest:
#       uses: ranjithrajv/awesome-enhancer/.github/workflows/research-digest.yml@main
#       with:
#         config-path: .github/research-digest.json
#       secrets: inherit
#
# The caller job must grant: contents: write, issues: write, models: read.
# contents: write is needed to commit the digest state file that records which
# candidates were accepted or rejected.

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the digest config, relative to the caller repository.
        type: string
        default: .github/research-digest.json
      days-back:
        description: Lookback window in days. 0 uses the value from the config.
        type: number
        default: 0
      model:
        description: Override the LLM model id (default from config, else openai/gpt-4o-mini).
        type: string
        default: ""
      label:
        description: Label applied to the digest issue, also used for dedupe history.
        type: string
        default: research
      dry-run:
        description: Scan and summarise without writing state or touching the issue.
        type: boolean
        default: false
      state-path:
        description: Where accepted/rejected history is stored in the caller repository.
        type: string
        default: .github/research-digest-state.json
      engine-repository:
        description: Repository that holds the digest engine.
        type: string
        default: ranjithrajv/awesome-enhancer
      engine-ref:
        description: Ref of the engine repository to run.
        type: string
        default: main
    secrets:
      LLM_API_KEY:
        description: Optional external LLM key. Falls back to the built-in GITHUB_TOKEN.
        required: false
      PRODUCTHUNT_TOKEN:
        description: Optional Product Hunt token. Product Hunt is skipped without it.
        required: false
      REDDIT_CLIENT_ID:
        description: Reddit app id for application-only OAuth. Without it Reddit uses the Atom feed.
        required: false
      REDDIT_CLIENT_SECRET:
        description: Reddit app secret for application-only OAuth.
        required: false

permissions:
  contents: write
  issues: write
  models: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: research-digest-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout list repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout digest engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.engine-repository }}
          ref: ${{ inputs.engine-ref }}
          path: .digest-engine

      - name: Find the open digest issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --label "${{ inputs.label }}" --state open \
            --limit 1 --json number --jq '.[0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/existing.md"
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > "$RUNNER_TEMP/existing.md"
          fi

      - name: Scan sources for candidate projects
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Models is opt-in: in testing models.github.ai answered every
          # request with a text/plain "OK" stub, so the default is the built-in
          # lexical ranking. Set LLM_API_KEY for any OpenAI-compatible endpoint.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://models.github.ai/inference
          LLM_MODEL: ${{ inputs.model }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DIGEST_LABEL: ${{ inputs.label }}
        run: |
          python3 .digest-engine/tools/research-digest/research_digest.py \
            --root . \
            --config "${{ inputs.config-path }}" \
            --days-back "${{ inputs.days-back }}" \
            --label "${{ inputs.label }}" \
            --state "${{ inputs.state-path }}" \
            --merge-into "$RUNNER_TEMP/existing.md" \
            --out "$RUNNER_TEMP/digest.md" \
            --json "$RUNNER_TEMP/digest.json" \
            --github-output

      - name: Add job summary
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/digest.md" ]; then
            cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-digest
          path: ${{ runner.temp }}/digest.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit digest state
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- "${{ inputs.state-path }}")" ]; then
            echo "::notice::Digest state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${{ inputs.state-path }}"
          git commit -m "chore(digest): update research state [skip ci]"
          git push

      - name: Open or update the digest issue
        if: ${{ !inputs.dry-run && steps.scan.outputs.candidates != '0' && steps.scan.outputs.candidates != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "${{ inputs.label }}" \
            --color 1D76DB --description "Auto-generated research digest" --force || true
          number="${{ steps.issue.outputs.number }}"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/digest.md"
            echo "::notice::Updated the rolling digest issue #$number"
          else
            gh issue create \
              --title "[auto] Research digest $(date -u +%Y-%m-%d)" \
              --body-file "$RUNNER_TEMP/digest.md" \
              --label "${{ inputs.label }}"
          fi
