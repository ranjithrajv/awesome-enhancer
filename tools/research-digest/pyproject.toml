[project]
name = "research-digest"
version = "2.0.0"
description = "Research digest engine for awesome lists: scan sources, dedupe, rank, and turn findings into pull requests."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
